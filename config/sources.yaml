# Corpus definition — the single source of truth for what gets crawled.
# Populated from Phase 0 findings (docs/phase0-findings.md), verified 2026-08-30.
#
# SHAPE: one Groww page yields MANY facts. The fetcher de-duplicates by URL
# (one fetch per scheme per run); the registry tracks each fact separately,
# because each carries its own source_as_of and max_age.
#
# FIELD ALLOWLIST (P0.4): `extract` names are an allowlist, not a hint. The
# Groww payload also carries groww_rating, analysis[] (PROS/CONS), peerComparison[]
# and full return series — all barred by PS §5.3. Ingesting the payload wholesale
# would put star ratings and return comparisons into the retrieval index, where
# they would surface as authoritative context. Only the facts listed here are
# ever extracted.

version: 1

fact_source:
  domain: groww.in            # the ONLY domain the ingestion path may fetch (ARCH §12)
  parser: groww_scheme_page   # the only fact parser (P0.1: server-rendered __NEXT_DATA__)
  crawl_delay_seconds: 3      # P0.5 — no Crawl-delay in robots.txt; self-imposed
  user_agent: "mf-faq-bot/1.0 (+https://github.com/OWNER/REPO)"
  timeout_seconds: 30
  max_retries: 2

# doc_type → freshness policy (PS §8.6, decided in P0.9).
# max_age is measured against source_as_of, NEVER fetched_at (PS §4.5 behaviour 5).
doc_types:
  nav:
    max_age_days: 1
    unit: business_days
    past_max_age: refuse      # a day-old NAV shown as current is simply wrong
    date_field: nav_date
  expense_ratio:
    max_age_days: 45
    past_max_age: flag
    date_field: historic_fund_expense[max].as_on_date
  exit_load:
    max_age_days: 400
    past_max_age: flag
    date_field: historic_exit_loads[max].as_on_date
  holdings:
    max_age_days: 45
    past_max_age: flag
    date_field: holdings[].portfolio_date
  # --- Page-level-date facts (PS §9, stakeholder decision) ---
  # These carry no publisher date. They take the page's nav_date as source_as_of.
  # Consequence: because nav_date advances daily, max_age can never trip, so they
  # are gate-exempt. The date lives in METADATA ONLY and must never be rendered
  # into fact-card text — otherwise the card changes daily, the hash changes
  # daily, and all three re-embed every run (defeats ARCH §8.3).
  min_sip:
    max_age_days: null
    past_max_age: exempt
    date_field: nav_date
    date_is_page_level: true
  lock_in:
    max_age_days: null
    past_max_age: exempt
    date_field: nav_date
    date_is_page_level: true
  benchmark:
    max_age_days: null
    past_max_age: exempt
    date_field: nav_date
    date_is_page_level: true

# Facts that are IN SCOPE per PS §4.2 but NOT obtainable — queries refuse.
# Eval coverage: eval/refusal.yaml R-oob-riskometer, R-oob-statement.
out_of_corpus:
  - fact: riskometer
    reason: >
      No reliable current-riskometer field. nfo_risk is NFO-time risk and
      return_stats[].risk disagrees with it for the same fund; neither is dated.
  - fact: statement_process
    reason: Not present on Groww scheme pages in any form.
  - fact: capital_gains_process
    reason: Not present on Groww scheme pages in any form.

